<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reward - NX ERAN</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(160deg, #0A0618, #120B24);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            max-width: 360px;
            width: 100%;
            padding: 30px 20px;
            text-align: center;
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.08);
            backdrop-filter: blur(10px);
        }
        .icon {
            font-size: 64px;
            margin-bottom: 12px;
        }
        .title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 6px;
            background: linear-gradient(135deg, #8B5CF6, #EC4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .amount {
            font-size: 42px;
            font-weight: 800;
            color: #F59E0B;
            margin: 12px 0;
        }
        .status {
            font-size: 14px;
            color: rgba(255,255,255,0.6);
            margin-bottom: 6px;
        }
        .user {
            font-size: 12px;
            color: rgba(255,255,255,0.4);
        }
        .success { color: #10B981; }
        .error { color: #EF4444; }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: #8B5CF6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 12px auto;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .btn {
            display: inline-block;
            padding: 10px 24px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            background: linear-gradient(135deg, #6C3CE1, #EC4899);
            color: white;
            margin-top: 12px;
            text-decoration: none;
        }
        .btn:hover {
            transform: scale(1.05);
        }
        .btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <div class="container" id="container">
        <div class="icon" id="icon">🔄</div>
        <div class="title" id="title">Processing...</div>
        <div class="spinner" id="spinner"></div>
        <div class="amount" id="amount">+Ⓝ0.00</div>
        <div class="status" id="status">Please wait...</div>
        <div class="user" id="user">User: Loading...</div>
        <a href="https://t.me/NxEranBot" class="btn" id="backBtn" style="display:none;">← Back to Bot</a>
    </div>

    <script>
        // ============================================================
        // CONFIG
        // ============================================================
        const BOT_USERNAME = 'NxEranBot';
        const BOT_TOKEN = '8002896346:AAG96XdUmW6auh_xvmljrj7hQGKymXsqJtg';

        // ============================================================
        // PROCESS
        // ============================================================
        function processReward() {
            const params = new URLSearchParams(window.location.search);
            const userId = params.get('userid') || params.get('userId') || params.get('id');
            const amount = parseFloat(params.get('amount') || params.get('reward') || 1);
            const type = params.get('type') || 'ad';
            const network = params.get('network') || '';
            const txId = params.get('tx') || Date.now().toString();

            const icon = document.getElementById('icon');
            const title = document.getElementById('title');
            const spinner = document.getElementById('spinner');
            const amountDisplay = document.getElementById('amount');
            const status = document.getElementById('status');
            const userDisplay = document.getElementById('user');
            const backBtn = document.getElementById('backBtn');

            userDisplay.textContent = `User: ${userId || 'Unknown'}`;
            amountDisplay.textContent = `+Ⓝ${amount.toFixed(2)}`;

            if (!userId) {
                icon.textContent = '❌';
                title.textContent = 'Invalid Request';
                status.textContent = 'No user ID provided';
                status.style.color = '#EF4444';
                spinner.style.display = 'none';
                backBtn.style.display = 'inline-block';
                return;
            }

            try {
                const userKey = `nxeran_userData_${userId}`;
                let userData = JSON.parse(localStorage.getItem(userKey) || '{}');

                if (!userData || Object.keys(userData).length === 0) {
                    userData = {
                        id: userId,
                        firstName: 'User',
                        username: 'user',
                        balance: 0,
                        totalEarn: 0,
                        totalAds: 0,
                        transactions: [],
                        giga: { count: 0, claimed: false, timerEnd: null },
                        monetag: { count: 0, claimed: false, timerEnd: null },
                        adexora: { count: 0, claimed: false, timerEnd: null },
                        spinRemaining: 30
                    };
                }

                // Credit
                userData.balance = (userData.balance || 0) + amount;
                userData.totalEarn = (userData.totalEarn || 0) + amount;
                userData.todayEarn = (userData.todayEarn || 0) + amount;
                userData.totalAds = (userData.totalAds || 0) + 1;

                // Transaction
                userData.transactions = userData.transactions || [];
                userData.transactions.unshift({
                    title: `${type} Reward${network ? ' (' + network + ')' : ''}`,
                    amount: amount,
                    date: new Date().toLocaleString(),
                    icon: 'fa-check-circle',
                    txId: txId
                });

                localStorage.setItem(userKey, JSON.stringify(userData));

                // Update admin data
                const adminData = JSON.parse(localStorage.getItem('nxeran_adminData') || '{}');
                const existing = adminData.users.find(u => u.id == userId);
                if (existing) {
                    existing.balance = userData.balance;
                    existing.totalEarn = userData.totalEarn;
                    existing.totalAds = userData.totalAds;
                } else {
                    adminData.users.push({
                        id: userId,
                        name: userData.firstName || 'User',
                        username: userData.username || 'user',
                        balance: userData.balance,
                        totalEarn: userData.totalEarn,
                        totalAds: userData.totalAds,
                        status: 'active',
                        joined: new Date().toLocaleDateString()
                    });
                }
                localStorage.setItem('nxeran_adminData', JSON.stringify(adminData));

                // Success
                icon.textContent = '✅';
                title.textContent = 'Reward Credited!';
                status.textContent = '🎉 Your reward has been added to your balance!';
                status.style.color = '#10B981';
                spinner.style.display = 'none';
                backBtn.style.display = 'inline-block';

                // Send bot notification to user
                sendBotMessage(userId, 
                    `💰 <b>Reward Received</b>\n\n` +
                    `+Ⓝ${amount.toFixed(2)} from ${type}${network ? ' (' + network + ')' : ''}\n` +
                    `New Balance: Ⓝ${userData.balance.toFixed(2)}`
                );

            } catch (error) {
                console.error('Reward error:', error);
                icon.textContent = '⚠️';
                title.textContent = 'Error';
                status.textContent = 'Failed to process reward';
                status.style.color = '#EF4444';
                spinner.style.display = 'none';
                backBtn.style.display = 'inline-block';
            }
        }

        // ============================================================
        // SEND BOT MESSAGE
        // ============================================================
        function sendBotMessage(chatId, message) {
            try {
                const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
                fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: chatId,
                        text: message,
                        parse_mode: 'HTML'
                    })
                }).catch(() => {});
            } catch(e) {}
        }

        // ============================================================
        // AUTO REDIRECT
        // ============================================================
        setTimeout(() => {
            const backBtn = document.getElementById('backBtn');
            if (backBtn.style.display !== 'inline-block') {
                backBtn.style.display = 'inline-block';
                backBtn.textContent = '⏳ Redirecting...';
                setTimeout(() => {
                    window.location.href = `https://t.me/${BOT_USERNAME}`;
                }, 2000);
            }
        }, 5000);

        // ============================================================
        // INIT
        // ============================================================
        document.addEventListener('DOMContentLoaded', processReward);

        console.log('🎯 NX ERAN Reward Handler');
        console.log('📱 Bot: @' + BOT_USERNAME);
    </script>
</body>
</html>
